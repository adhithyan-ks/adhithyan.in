<!DOCTYPE html>
<html lang="en" class="container">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhithyan - Product Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&family=Oldenburg&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        background-color: black;
      }

      body {
        color: #ffffff;
        margin: 0;
        overflow-x: hidden;
        position: relative;
        font-family: "Hanken Grotesk", sans-serif;
        font-optical-sizing: auto;
        font-weight: 150;
        font-style: normal;
        cursor: crosshair;
      }

      .nav {
        display: flex;
        justify-content: center;
        padding: 2rem 0;
      }

      .logo {
        display: flex;
        align-items: center;
      }

      .logo-a {
        color: rgb(0, 0, 0);
        font-size: 2rem;
        font-weight: bold;
        margin-right: -0.5rem;
        font-family: "Oldenburg", cursive;
      }

      .menu {
        display: flex;
        list-style: none;
        justify-content: center;
      }

      .menu li {
        margin-left: 2rem;
      }

      .menu a {
        text-decoration: none;
        color: #ffffff;
        font-family: "Instrument Serif", serif;
        font-size: 1.5rem;
      }

      .content {
        display: flex;
        flex-direction: column; /*
        align-items: center;
        justify-content: center;*/
        margin: 100px;
        padding: 4rem 0;
        position: relative;
      }

      .main-logo {
        margin-bottom: 2rem;
        font-size: 4rem;
        display: flex;
      }

      h1 {
        font-family: "Instrument Serif", serif;
        font-size: 3.5rem;
        text-align: left;
        margin-bottom: 1.5rem;
        font-weight: normal;
        position: relative;
        z-index: 2;
      }

      .tagline {
        text-align: center;
        max-width: 800px;
        font-size: 1.5rem;
        line-height: 1.5;
        margin-bottom: 4rem;
        position: relative;
        z-index: 2;
      }

      /* Using your exact glow-circle styles */
      .glow-circle {
        width: 200px;
        height: 200px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        align-self: center;
        background: radial-gradient(circle, rgb(255, 87, 87), white);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
        z-index: 1;
        box-shadow: 0 0 10px rgba(255, 87, 87, 0.5),
          0 0 20px rgba(255, 87, 87, 0.5), 0 0 30px rgba(255, 87, 87, 0.5),
          0 0 40px rgba(255, 87, 87, 0.5), 0 0 50px rgba(255, 87, 87, 0.5);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 0.8;
        }
      }

      /* Create a subtle text shadow for better readability 
      h1,
      .tagline {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      }*/

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @media (max-width: 600px) {
        .nav {
          flex-direction: column;
          gap: 1rem;
        }

        .menu {
          justify-content: center;
        }

        .menu li {
          margin: 0 1rem;
        }

        h1 {
          font-size: 2.5rem;
        }

        .tagline {
          font-size: 1.2rem;
        }

        .glow-circle {
          width: 150px;
          height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <ul class="menu">
        <li><a href="#">Work</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Funzies</a></li>
        <li><a href="#">Resume</a></li>
      </ul>
    </nav>

    <div class="content">
      <div class="main-logo">
        <img
          src="pfp.png"
          alt="Adhithyan"
          style="height: 100px; border-radius: 20px"
        />
      </div>
      <h1>Adhithyan</h1>
      <p class="tagline">
        I'm a computer science student based in India, with a passion for many
        other things.
      </p>
    </div>
  </body>
</html>
