<!DOCTYPE html>
<html lang="en" class="container">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhithyan - Product Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&family=Oldenburg&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        color: #000000;
        margin: 0;
        overflow-x: hidden;
        position: relative;
        font-family: "Hanken Grotesk", sans-serif;
        font-optical-sizing: auto;
        font-weight: 150;
        font-style: normal;
        cursor: crosshair;
      }

      .container {
        width: 100%;
        min-height: 100vh;
        --color: rgba(69, 69, 69, 0.096);
        background-color: #ffffff;
        background-image: linear-gradient(
            0deg,
            transparent 24%,
            var(--color) 25%,
            var(--color) 26%,
            transparent 27%,
            transparent 74%,
            var(--color) 75%,
            var(--color) 76%,
            transparent 77%,
            transparent
          ),
          linear-gradient(
            90deg,
            transparent 24%,
            var(--color) 25%,
            var(--color) 26%,
            transparent 27%,
            transparent 74%,
            var(--color) 75%,
            var(--color) 76%,
            transparent 77%,
            transparent
          );
        background-size: 45px 45px;
        background-attachment: fixed;
        padding: 0 5%;
      }

      .nav {
        display: flex;
        justify-content: center;
        padding: 2rem 0;
      }

      .logo {
        display: flex;
        align-items: center;
      }

      .logo-a {
        color: rgb(0, 0, 0);
        font-size: 2rem;
        font-weight: bold;
        margin-right: -0.5rem;
        font-family: "Oldenburg", cursive;
      }

      .menu {
        display: flex;
        list-style: none;
        justify-content: center;
      }

      .menu li {
        margin-left: 2rem;
      }

      .menu a {
        text-decoration: none;
        color: #000000;
        font-family: "Instrument Serif", serif;
        font-size: 1.5rem;
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 0;
      }

      .main-logo {
        margin-bottom: 2rem;
        font-size: 4rem;
        display: flex;
      }

      h1 {
        font-family: "Instrument Serif", serif;
        font-size: 3.5rem;
        text-align: center;
        margin-bottom: 1.5rem;
        font-weight: normal;
      }

      .tagline {
        text-align: center;
        max-width: 800px;
        font-size: 1.5rem;
        line-height: 1.5;
        margin-bottom: 4rem;
      }

      .projects {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 1200px;
        margin-bottom: 2rem;
      }

      .project-card {
        background: #ddd;
        border-radius: 1rem;
        overflow: hidden;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .project-image {
        width: 100%;
        height: 200px;
        background-color: #ddd;
      }

      @media (max-width: 600px) {
        .nav {
          flex-direction: column;
          gap: 1rem;
        }

        .menu {
          justify-content: center;
        }

        .menu li {
          margin: 0 1rem;
        }

        h1 {
          font-size: 2.5rem;
        }

        .tagline {
          font-size: 1.2rem;
        }
      }
      .glow-circle {
        width: 50px;
        height: 50px;
        position: fixed;
        align-self: center;
        background: radial-gradient(circle, rgb(255, 87, 87), transparent 100%);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
        margin: 20px 0;
        box-shadow: 0 0 10px rgba(255, 87, 87, 0.5),
          0 0 20px rgba(255, 87, 87, 0.5), 0 0 30px rgba(255, 87, 87, 0.5),
          0 0 40px rgba(255, 87, 87, 0.5), 0 0 50px rgba(255, 87, 87, 0.5);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div class="">
      <nav class="nav">
        <!--
        <div class="logo">
          <div class="logo-a">Â</div>
        </div>  -->
        <ul class="menu">
          <li><a href="#">Work</a></li>
          <li><a href="#">About</a></li>
          <li class="glow-circle"><a href="/"></a></li>
          <li><a href="#">Funzies</a></li>
          <li><a href="#">Resume</a></li>
        </ul>
      </nav>

      <div class="content">
        <div class="main-logo">
          <!--
          <div
            class="logo-a"
            style="font-size: 4rem; font-family: 'Oldenburg', cursive"
          >
            Â
          </div>-->
        </div>
        <h1>Adhithyan</h1>
        <p class="tagline">
          I'm a computer science student based in India, with a passion for many
          other things.
        </p>
        <!--
        <div class="projects">
          <div class="project-card">
            <div class="project-image"></div>
          </div>
          <div class="project-card">
            <div class="project-image"></div>
          </div>
        </div>
        -->
      </div>
    </div>
  </body>
</html>
