<!DOCTYPE html>
<html lang="en" class="container">
  <head>
    <meta charset="UTF-8" />

    <title>Adhithyan</title>
    <link rel="icon" href="pfpsquare.jpg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&family=Oldenburg&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: table;
        width: 100%;
        height: 100%;
        background-color: #171717;
        color: #eee;
        line-height: 1.6;
        position: relative;
        font-family: sans-serif;
        overflow: hidden;
      }

      .lines {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        margin: auto;
        width: 100%;
      }

      .line {
        position: absolute;
        width: 1px;
        height: 100%;
        top: 0;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .line::after {
        content: "";
        display: block;
        position: absolute;
        height: 15vh;
        width: 100%;
        top: -50%;
        left: 0;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0) 0%,
          #ffffff 75%,
          #ffffff 100%
        );
        animation: drop 7s infinite;
        animation-fill-mode: forwards;
        animation-timing-function: cubic-bezier(0.4, 0.26, 0, 0.97);
      }

      .line:nth-child(1) {
        left: 10%;
      }
      .line:nth-child(1)::after {
        animation-delay: 0s;
      }

      .line:nth-child(2) {
        left: 30%;
      }
      .line:nth-child(2)::after {
        animation-delay: 1s;
      }

      .line:nth-child(3) {
        left: 50%;
      }
      .line:nth-child(3)::after {
        animation-delay: 2s;
      }

      .line:nth-child(4) {
        left: 70%;
      }
      .line:nth-child(4)::after {
        animation-delay: 3s;
      }

      .line:nth-child(5) {
        left: 90%;
      }
      .line:nth-child(5)::after {
        animation-delay: 4s;
      }

      @keyframes drop {
        0% {
          top: -50%;
        }
        100% {
          top: 110%;
        }
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      h1 {
        font-family: "Instrument Serif", serif;
        font-size: 5.5rem;
        text-align: center;
        font-weight: normal;
        position: relative;
        z-index: 2;
        padding-top: 15%;
      }

      .links {
        margin-top: 2rem;
        position: relative;
        z-index: 2;
      }

      .links ul {
        display: flex;
        list-style: none;
        gap: 2rem;
        justify-content: center;
      }

      .links svg {
        width: 32px;
        height: 32px;
        fill: #eee;
        transition: fill 0.3s ease, transform 0.3s ease;
      }

      .links a:hover svg {
        fill: #ffffff;
        transform: scale(1.1);
        filter: drop-shadow(0 0 8px #ffffff);
      }

      .fixed-nav {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        backdrop-filter: blur(10px);
        background-color: rgba(81, 81, 81, 0.1);
        border-radius: 8px;
        padding: 5px 8px;
        display: flex;
        align-items: center;
        gap: 5px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 1000;
        transition: width 0.3s ease, padding 0.3s ease;
        width: auto;
        overflow: hidden;
      }

      .fixed-nav:hover {
        width: auto;
        padding-right: 120px;
      }

      .profile-section:hover ~ .icon-buttons .button-wrapper {
        transform: translateX(0);
      }

      .profile-section {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .profile-section:hover {
        cursor: pointer;
      }

      .profile-img {
        width: 30px;
        height: 30px;
        border-radius: 20%;
        border-width: 2px;
        border-style: solid;
        border-color: #444;
        background-color: #444;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .profile-name {
        font-family: "Hanken Grotesk", sans-serif;
        font-weight: 500;
        font-size: 15px;
        color: #eee;
        text-align: center;
        padding-right: 8px;
      }

      .divider {
        width: 2px;
        height: 20px;
        background-color: rgb(255, 255, 255);
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 6px;
        transition: background-color 0.2s ease;
        cursor: pointer;
      }

      .icon-buttons {
        display: flex;
        gap: 5px;
        position: relative;
      }

      .icon-button {
        width: 36px;
        height: 36px;
        border-radius: 15%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        z-index: 2;
      }

      .icon-button:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .icon-button:hover svg {
        fill: #ffffff;
        filter: drop-shadow(0 0 8px #ffffff);
      }

      .icon-button .label {
        position: absolute;
        left: calc(100% + 8px);
        top: 50%;
        transform: translateY(-50%);
        color: white;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        font-family: "Hanken Grotesk", sans-serif;
        pointer-events: none;
        text-transform: capitalize;
        font-weight: 500;
      }

      .button-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        transition: all 0.3s ease;
        margin-right: 0;
      }

      .button-wrapper:hover .label {
        opacity: 1;
        visibility: visible;
      }

      .fixed-nav:hover .button-wrapper:hover ~ .button-wrapper {
        transform: translateX(80px);
      }

      .fixed-nav:hover #dev-wrapper:hover ~ .button-wrapper {
        transform: translateX(60px);
      }

      .fixed-nav:hover #projects-wrapper:hover ~ .button-wrapper {
        transform: translateX(95px);
      }

      .fixed-nav:hover #blog-wrapper:hover ~ .button-wrapper {
        transform: translateX(70px);
      }

      .fixed-nav:hover {
        padding-right: 120px;
      }

      #dev-wrapper:hover ~ .button-wrapper {
        transform: translateX(60px);
      }

      #projects-wrapper:hover ~ .button-wrapper {
        transform: translateX(95px);
      }

      #blog-wrapper:hover ~ .button-wrapper {
        transform: translateX(70px);
      }

      .fixed-nav:not(:hover) {
        width: auto;
        padding-right: 8px;
      }

      .fixed-nav:not(:hover) .button-wrapper .label {
        opacity: 0;
        visibility: hidden;
      }

      .fixed-nav:not(:hover) .button-wrapper ~ .button-wrapper {
        transform: translateX(0);
      }
    </style>
