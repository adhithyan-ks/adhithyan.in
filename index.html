<!DOCTYPE html>
<html lang="en" class="container">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhithyan - Product Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&family=Oldenburg&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: table;
        width: 100%;
        height: 100%;
        background-color: #171717;
        color: #eee;
        line-height: 1.6;
        position: relative;
        font-family: sans-serif;
        overflow: hidden;
      }

      .lines {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        margin: auto;
        width: 100%;
      }

      .line {
        position: absolute;
        width: 1px;
        height: 100%;
        top: 0;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .line::after {
        content: "";
        display: block;
        position: absolute;
        height: 15vh;
        width: 100%;
        top: -50%;
        left: 0;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0) 0%,
          #ffffff 75%,
          #ffffff 100%
        );
        animation: drop 7s infinite;
        animation-fill-mode: forwards;
        animation-timing-function: cubic-bezier(0.4, 0.26, 0, 0.97);
      }

      /* Evenly spaced lines */
      .line:nth-child(1) {
        left: 10%;
      }
      .line:nth-child(1)::after {
        animation-delay: 0s;
      }

      .line:nth-child(2) {
        left: 30%;
      }
      .line:nth-child(2)::after {
        animation-delay: 1s;
      }

      .line:nth-child(3) {
        left: 50%;
      }
      .line:nth-child(3)::after {
        animation-delay: 2s;
      }

      .line:nth-child(4) {
        left: 70%;
      }
      .line:nth-child(4)::after {
        animation-delay: 3s;
      }

      .line:nth-child(5) {
        left: 90%;
      }
      .line:nth-child(5)::after {
        animation-delay: 4s;
      }

      /* Animation */
      @keyframes drop {
        0% {
          top: -50%;
        }
        100% {
          top: 110%;
        }
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      h1 {
        font-family: "Instrument Serif", serif;
        font-size: 5.5rem;
        text-align: center;
        font-weight: normal;
        position: relative;
        z-index: 2;
        padding-top: 20%;
      }
    </style>
  </head>
  <body>
    <div class="lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="content">
      <div class="main-logo"></div>
      <h1>Adhithyan</h1>

        </ul>
      </div>
    </div>
  </body>
</html>
